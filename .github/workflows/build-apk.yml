name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npx cap add android
      - name: Generate app icons
        continue-on-error: true
        run: npx -y @capacitor/assets generate --android
      - name: Manifest permissions
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i '/android.permission.INTERNET/d' $M
          sed -i 's#android:launchMode="singleTask"#android:launchMode="singleTask" android:screenOrientation="portrait"#' $M
          for P in POST_NOTIFICATIONS VIBRATE RECEIVE_BOOT_COMPLETED SCHEDULE_EXACT_ALARM USE_EXACT_ALARM ACCESS_COARSE_LOCATION ACCESS_FINE_LOCATION; do
            sed -i "s#<application#<uses-permission android:name=\"android.permission.$P\"/>\n    <application#" $M
          done
      - name: Azan sound (optional)
        run: |
          for D in assets resources; do
            for E in mp3 wav ogg; do
              if [ -f $D/azan.$E ]; then
                mkdir -p android/app/src/main/res/raw
                cp $D/azan.$E android/app/src/main/res/raw/azan.$E
              fi
            done
          done
      - name: Reminder chime (generated)
        run: |
          mkdir -p android/app/src/main/res/raw
          python3 - <<'PY'
          import wave, math, struct
          sr = 22050
          total = int(sr * 2.6)
          buf = [0.0] * total
          for start, f in ((0.0, 880.0), (0.45, 1174.66)):
              s0 = int(sr * start)
              for i in range(int(sr * 2.0)):
                  t = i / sr
                  env = math.exp(-2.2 * t) * min(1.0, i / (sr * 0.006))
                  v = env * (math.sin(2*math.pi*f*t) + 0.4*math.sin(2*math.pi*2*f*t) + 0.2*math.sin(2*math.pi*3*f*t))
                  if s0 + i < total:
                      buf[s0 + i] += v
          peak = max(abs(x) for x in buf)
          w = wave.open("android/app/src/main/res/raw/tazkir.wav", "wb")
          w.setnchannels(1); w.setsampwidth(2); w.setframerate(sr)
          w.writeframes(b"".join(struct.pack("<h", int(30000 * x / peak)) for x in buf))
          w.close()

          PY
      - name: Copy data files to www
        run: |
          for F in ara-*.json hisn_almuslim.json; do
            if [ -f "$F" ] && [ ! -f "www/$F" ]; then cp "$F" "www/$F"; fi
          done
      - name: Download Bukhari and Muslim (bundled into the app, app stays offline)
        continue-on-error: true
        run: |
          for E in ara-bukhari ara-muslim; do
            for U in "https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1/editions/$E.min.json" "https://raw.githubusercontent.com/fawazahmed0/hadith-api/1/editions/$E.min.json"; do
              if curl -fsSL --retry 3 --max-time 600 "$U" -o "www/$E.min.json"; then echo "downloaded from $U"; break; fi
            done
            python3 -c "import json;d=json.load(open('www/$E.min.json',encoding='utf-8'));print('$E hadiths:',len(d['hadiths']))" || rm -f "www/$E.min.json"
            ls -la www/ | grep "$E" || echo "$E NOT FOUND"
          done
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SAKINAH-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
