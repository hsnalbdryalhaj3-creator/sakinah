name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npx cap add android
      - name: Generate app icons
        continue-on-error: true
        run: npx -y @capacitor/assets generate --android
      - name: Manifest permissions
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i '/android.permission.INTERNET/d' $M
          for P in POST_NOTIFICATIONS VIBRATE RECEIVE_BOOT_COMPLETED SCHEDULE_EXACT_ALARM USE_EXACT_ALARM ACCESS_COARSE_LOCATION ACCESS_FINE_LOCATION; do
            sed -i "s#<application#<uses-permission android:name=\"android.permission.$P\"/>\n    <application#" $M
          done
      - name: Azan sound (optional)
        run: |
          for D in assets resources; do
            for E in mp3 wav ogg; do
              if [ -f $D/azan.$E ]; then
                mkdir -p android/app/src/main/res/raw
                cp $D/azan.$E android/app/src/main/res/raw/azan.$E
              fi
            done
          done
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SAKINAH-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
